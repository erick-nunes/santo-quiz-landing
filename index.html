<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Santo Quiz</title>
    <link rel="icon" href="/img/icon.png" />
    <link rel="alternate" hreflang="pt" href="/pt" />
    <link rel="alternate" hreflang="en" href="/en" />
    <link rel="alternate" hreflang="es" href="/es" />
    <link rel="alternate" hreflang="x-default" href="/pt" />
    <script>
      (function () {
        var supported = ['pt', 'en', 'es'];
        var first = (navigator.language || 'pt').toLowerCase().slice(0, 2);
        var lang = supported.indexOf(first) >= 0 ? first : 'pt';
        location.replace('/' + lang + '/');
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/pt/" />
  </head>
  <body>
    <p>
      <a href="/pt/">Português</a> ·
      <a href="/en/">English</a> ·
      <a href="/es/">Español</a>
    </p>
  </body>
</html>
