server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml
        application/manifest+json;

    # Segurança básica
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache longo pra assets com conteúdo imutável (imagens, fontes)
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Cache médio pra css/js (versionamento virá com fingerprint no futuro)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # HTML: sem cache (pra mudanças refletirem na hora)
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Redireciona /pt → /pt/ pra evitar 404
    location = /pt { return 301 /pt/; }
    location = /en { return 301 /en/; }
    location = /es { return 301 /es/; }

    # robots.txt: 404 real se não existir (nunca fallback HTML)
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # sitemap.xml: content-type explícito e 404 real se faltar
    location = /sitemap.xml {
        types { } default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Healthcheck pro EasyPanel
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Rotas limpas: /pt/ serve pt/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
